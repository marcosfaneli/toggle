apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  username: toggle
  password: toggle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toggle-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toggle-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toggle-server
    spec:
      containers:
        - name: toggle-server
          image: toggle-server:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: host.minikube.internal
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: toggle_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: password
            - name: TOGGLE_SECURITY_ALLOW_LOCAL_CALLBACKS
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: toggle-server
spec:
  selector:
    app.kubernetes.io/name: toggle-server
  ports:
    - name: http
      port: 8080
      targetPort: http
