apiVersion: v1
kind: ConfigMap
metadata:
  name: toggle-client-config
data:
  application-k8s.yml: |
    server:
      port: 8082

    feature:
      toggles:
        service-name: checkout-service
        instance-id: ${POD_NAME}
        pod-name: ${POD_NAME}
        namespace: ${POD_NAMESPACE}
        server-base-url: http://toggle-server:8080
        callback-base-url: http://${POD_IP}:8082
        callback-path: /internal/feature-toggles
        heartbeat-interval-ms: 5000
        consumed:
          novo-checkout: LOCAL_CACHE
          pagamento-v2: REMOTE_ALWAYS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toggle-client-simple
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: toggle-client-simple
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toggle-client-simple
    spec:
      containers:
        - name: toggle-client-simple
          image: toggle-client-simple:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: toggle-client-config
---
apiVersion: v1
kind: Service
metadata:
  name: toggle-client-simple
spec:
  selector:
    app.kubernetes.io/name: toggle-client-simple
  ports:
    - name: http
      port: 8082
      targetPort: http
