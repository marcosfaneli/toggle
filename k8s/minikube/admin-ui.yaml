apiVersion: apps/v1
kind: Deployment
metadata:
  name: toggle-admin-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toggle-admin-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toggle-admin-ui
    spec:
      containers:
        - name: toggle-admin-ui
          image: toggle-admin-ui:minikube
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: toggle-admin-ui
spec:
  selector:
    app.kubernetes.io/name: toggle-admin-ui
  ports:
    - name: http
      port: 80
      targetPort: http
