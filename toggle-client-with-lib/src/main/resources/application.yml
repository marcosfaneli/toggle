server:
  port: 8083

spring:
  application:
    name: checkout-service-with-lib

feature:
  toggles:
    service-name: checkout-service-with-lib
    instance-id: checkout-with-lib-local-1
    pod-name: checkout-with-lib-local-1
    namespace: local
    server-base-url: http://localhost:8080
    api-key: ${SWITCHBOARD_API_KEY:}
    callback-base-url: http://localhost:8083
    callback-path: /internal/feature-toggles
    heartbeat-interval-ms: 5000
    consumed:
      new-checkout: LOCAL_CACHE
      payment-v2: REMOTE_ALWAYS
