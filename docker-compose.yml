services:
  mysql:
    image: mysql:8.4
    container_name: toggle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: toggle_db
      MYSQL_USER: toggle
      MYSQL_PASSWORD: toggle
    ports:
      - "3306:3306"
    volumes:
      - toggle_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utoggle", "-ptoggle"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: toggle-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: toggle-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8089:8080"
    volumes:
      - ./docker/keycloak/switchboard-realm.json:/opt/keycloak/data/import/switchboard-realm.json:ro

  toggle-server:
    build:
      context: ./toggle-server
    container_name: toggle-server
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: toggle_db
      DB_USERNAME: toggle
      DB_PASSWORD: toggle
      TOGGLE_SECURITY_ALLOW_LOCAL_CALLBACKS: "true"
      TOGGLE_AUTH_MODE: oidc
      OIDC_ISSUER_URI: http://localhost:8089/realms/switchboard
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/switchboard/protocol/openid-connect/certs
      OIDC_CLIENT_ID: switchboard-admin-ui
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  toggle-admin-ui:
    build:
      context: ./toggle-admin-ui
    container_name: toggle-admin-ui
    ports:
      - "4200:80"
    volumes:
      - ./docker/admin-ui/auth-config.oidc.json:/usr/share/nginx/html/auth-config.json:ro
    depends_on:
      - toggle-server

volumes:
  toggle_mysql_data:
