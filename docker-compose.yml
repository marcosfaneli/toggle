services:
  mysql:
    image: mysql:8.4
    container_name: toggle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: toggle_db
      MYSQL_USER: toggle
      MYSQL_PASSWORD: toggle
    ports:
      - "3306:3306"
    volumes:
      - toggle_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utoggle", "-ptoggle"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: toggle-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  toggle_mysql_data:
