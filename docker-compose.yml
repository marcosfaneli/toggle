services:
  mysql:
    image: mysql:8.4
    container_name: toggle-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: toggle_db
      MYSQL_USER: toggle
      MYSQL_PASSWORD: toggle
    ports:
      - "3306:3306"
    volumes:
      - toggle_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-utoggle", "-ptoggle"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: toggle-adminer
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy

  toggle-server:
    build:
      context: ./toggle-server
    container_name: toggle-server
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: toggle_db
      DB_USERNAME: toggle
      DB_PASSWORD: toggle
      TOGGLE_SECURITY_ALLOW_LOCAL_CALLBACKS: "true"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  toggle-admin-ui:
    build:
      context: ./toggle-admin-ui
    container_name: toggle-admin-ui
    ports:
      - "4200:80"
    depends_on:
      - toggle-server

volumes:
  toggle_mysql_data:
