spring:
  application:
    name: toggle-server
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:toggle_db}?useSSL=${DB_USE_SSL:true}&serverTimezone=UTC&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}
    username: ${DB_USERNAME:toggle}
    password: ${DB_PASSWORD:toggle}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8089/realms/switchboard}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8089/realms/switchboard/protocol/openid-connect/certs}
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    persist-authorization: true
    oauth:
      client-id: ${OIDC_CLIENT_ID:switchboard-admin-ui}
      use-pkce-with-authorization-code-grant: true

server:
  port: 8080

toggle:
  auth:
    mode: ${TOGGLE_AUTH_MODE:none}
    oidc:
      client-id: ${OIDC_CLIENT_ID:switchboard-admin-ui}
  api:
    max-page-size: 100
  security:
    allow-local-callbacks: false
  heartbeat:
    expiration-timeout-minutes: 5
    expiration-check-interval-ms: 60000
  delivery:
    timeout-ms: 3000

