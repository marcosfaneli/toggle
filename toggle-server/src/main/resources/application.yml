spring:
  application:
    name: toggle-server
  datasource:
    url: jdbc:mysql://localhost:3306/toggle_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: toggle
    password: toggle
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

toggle:
  api:
    max-page-size: 100
  heartbeat:
    expiration-timeout-minutes: 5
    expiration-check-interval-ms: 60000
  delivery:
    timeout-ms: 3000

